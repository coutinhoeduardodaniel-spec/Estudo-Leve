<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudo Leve</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudo Leve">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#1e293b;margin:0}
.d{font-family:'Plus Jakarta Sans',Inter,sans-serif}
.fade{animation:f .25s ease-out}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sum h3{font-weight:700;margin:.6rem 0 .25rem;color:#1e3a8a}.sum ul{list-style:disc;padding-left:1.2rem}.sum p{margin:.3rem 0}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:1.25rem;padding:1.25rem}
.btn{background:#2563eb;color:#fff;font-weight:600;font-size:.85rem;padding:.6rem 1rem;border-radius:.75rem}.btn:hover{background:#1d4ed8}
.btn2{background:#eff6ff;color:#1d4ed8;font-weight:600;font-size:.8rem;padding:.5rem .9rem;border-radius:.75rem}
.inp{width:100%;border:1px solid #e2e8f0;border-radius:.75rem;padding:.55rem .8rem;font-size:.875rem;background:#fff}
.inp:focus{outline:2px solid #bfdbfe;border-color:#3b82f6}
</style>
</head>
<body>
<div id="toast" class="fixed right-4 z-50 flex flex-col gap-2" style="top:calc(env(safe-area-inset-top,0px) + 12px)"></div>

<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200" style="padding-top:0">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2"><div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-sky-400 flex items-center justify-center text-white">🪶</div>
      <div><div class="d font-extrabold text-lg leading-none text-slate-900">Estudo Leve</div><div class="text-[11px] text-sky-600 font-medium">Aprender sem peso</div></div></div>
    <button onclick="openProfile()" class="flex items-center gap-2 bg-blue-50 border border-blue-100 rounded-full px-3 py-1.5"><span id="av">🎓</span><span id="nm" class="text-xs font-semibold text-blue-800 max-w-[110px] truncate">Estudante</span><span id="rl" class="text-[10px] font-semibold bg-blue-100 text-blue-700 rounded px-1.5">Aluno</span></button>
  </div>
  <nav id="nav" class="max-w-6xl mx-auto px-4 pb-2 flex gap-1.5 overflow-x-auto text-sm"></nav>
</header>

<main id="main" class="max-w-6xl mx-auto p-4 sm:p-6"></main>

<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 p-4"><div id="modalbox" class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl fade max-h-[90vh] overflow-y-auto"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const AVATARS=['🎓','🚀','🦉','💡','📘','🧠','🌟','🦊','🎨','⚡'];

const SEED={
 announcements:[
  {id:'a1',title:'Bem-vindos ao novo semestre! 💙',priority:'info',content:'A trilha de estudos, os materiais e o Tutor IA já estão liberados. Acompanhem as metas de revisão semanalmente.',createdAt:new Date().toISOString()},
  {id:'a2',title:'Simulado Diagnóstico na próxima semana',priority:'important',content:'Revisem os módulos de Funções Quadráticas e Ecologia na trilha interativa.',createdAt:new Date(Date.now()-864e5).toISOString()}],
 exams:[
  {id:'e1',subject:'Matemática',title:'P1 - Funções e Equações',date:day(5),time:'08:30',location:'Sala 104 - Bloco Azul'},
  {id:'e2',subject:'Biologia',title:'Prova Bimestral - Ecologia',date:day(9),time:'10:15',location:'Laboratório de Ciências'},
  {id:'e3',subject:'História',title:'Seminário - Brasil Contemporâneo',date:day(14),time:'14:00',location:'Auditório Central'}],
 lessons:[
  {id:'l1',order:1,subject:'Matemática',title:'Funções do 2º Grau e a Parábola',description:'Coeficientes, vértice, raízes e leitura de parábolas.',video:'https://www.youtube.com/embed/Z5a324-O0aM',
   summary:'<h3>1. Definição</h3><p>f(x) = ax² + bx + c, com a ≠ 0. O gráfico é uma <strong>parábola</strong>.</p><h3>2. Concavidade e Δ</h3><ul><li><strong>a &gt; 0:</strong> concavidade para cima (mínimo).</li><li><strong>a &lt; 0:</strong> para baixo (máximo).</li><li><strong>Δ = b² − 4ac:</strong> Δ&gt;0 duas raízes; Δ=0 uma; Δ&lt;0 nenhuma real.</li></ul><h3>3. Vértice</h3><p><strong>xᵥ = −b/2a</strong> e <strong>yᵥ = −Δ/4a</strong>.</p>',
   questions:[
    {q:'Em f(x) = −2x² + 8x − 6, qual a concavidade e o xᵥ?',o:['Para cima, xᵥ = 2','Para baixo, xᵥ = 2','Para baixo, xᵥ = −2','Para cima, xᵥ = 4'],c:1,e:'a = −2 < 0 → para baixo. xᵥ = −8/(2·−2) = 2.'},
    {q:'Quando Δ = 0, o que acontece com o gráfico?',o:['Não toca o eixo X','Corta o eixo X em dois pontos','Tangencia o eixo X em um ponto','Vira uma reta'],c:2,e:'Duas raízes reais e iguais: o vértice toca o eixo X.'}]},
  {id:'l2',order:2,subject:'Biologia',title:'Cadeias Alimentares e Fluxo de Energia',description:'Níveis tróficos, produtores, consumidores e a regra dos 10%.',video:'https://www.youtube.com/embed/1_k5F2fB80k',
   summary:'<h3>1. Níveis Tróficos</h3><p>A matéria circula; a <strong>energia flui em uma só direção</strong>, decrescente.</p><ul><li><strong>Produtores:</strong> autótrofos (plantas, algas).</li><li><strong>Consumidores:</strong> herbívoros e carnívoros.</li><li><strong>Decompositores:</strong> fungos e bactérias.</li></ul><h3>2. Pirâmide de Energia</h3><p>Nunca é invertida: só cerca de 10% da energia passa ao nível seguinte.</p>',
   questions:[{q:'Por que a pirâmide de energia nunca é invertida?',o:['Decompositores produzem luz','A energia aumenta a cada nível','Parte da energia se dissipa como calor em cada nível','Há mais predadores que plantas'],c:2,e:'A cada transferência, grande parte da energia é gasta no metabolismo e dissipada como calor.'}]},
  {id:'l3',order:3,subject:'Redação',title:'Dissertação-Argumentativa Nota 1000',description:'Tese, repertório sociocultural e proposta de intervenção completa.',video:'https://www.youtube.com/embed/r4t8_b4P7m4',
   summary:'<h3>Os 4 parágrafos</h3><ul><li><strong>Introdução:</strong> contexto + tema + tese.</li><li><strong>Desenvolvimento 1 e 2:</strong> tópico frasal + fundamentação + análise.</li><li><strong>Conclusão:</strong> Agente, Ação, Meio/Modo, Efeito e Detalhamento.</li></ul>',
   questions:[{q:'Quais os 5 elementos da proposta de intervenção?',o:['Título, Tese, Citação, Antítese, Síntese','Agente, Ação, Meio/Modo, Efeito, Detalhamento','Introdução, Clímax, Desfecho, Moral, Referência','Sujeito, Verbo, Predicado, Adjunto, Vocativo'],c:1,e:'Quem faz, o que faz, como faz, para quê e um detalhamento extra.'}]}],
 materials:[
  {id:'m1',title:'Apostila Ilustrada: Funções e Gráficos',subject:'Matemática',type:'PDF',description:'25 exercícios resolvidos passo a passo sobre funções afim e quadrática.',url:''},
  {id:'m2',title:'Mapa Mental: Ciclos Biogeoquímicos',subject:'Biologia',type:'Mapa Mental',description:'Resumo visual dos ciclos da água, carbono, nitrogênio e oxigênio.',url:''},
  {id:'m3',title:'Banco de Repertórios Socioculturais',subject:'Redação',type:'Slides',description:'Citações, dados históricos e referências coringas para eixos temáticos atuais.',url:''},
  {id:'m4',title:'Lista de Treino: Cinemática e Newton',subject:'Física',type:'Lista de Exercícios',description:'15 questões de vestibulares com gabarito comentado.',url:''}]
};

let S={profile:{name:'Estudante',avatar:'🎓',role:'student'},progress:{sum:[],vid:[],quiz:{},notes:''},data:JSON.parse(JSON.stringify(SEED))};
try{const r=localStorage.getItem('estudo-leve');if(r){const p=JSON.parse(r);S={...S,...p,progress:{...S.progress,...p.progress},data:{...S.data,...p.data}}}}catch(e){}
const save=()=>{try{localStorage.setItem('estudo-leve',JSON.stringify(S))}catch(e){}};

let tab='dash',activeLesson=null,sub='summary',trailFilter='all',libFilter='all',libSearch='',ownerSec='ann',chat=[];
const TABS=[['dash','🏠 Início'],['trail','🗺️ Trilha'],['exams','📅 Provas'],['lib','📚 Biblioteca'],['tutor','🤖 Tutor IA'],['owner','🛡️ Proprietário']];

function toast(m,t='info'){const c={success:'bg-emerald-600',error:'bg-red-600',info:'bg-blue-700'}[t];const d=document.createElement('div');d.className=`${c} text-white px-4 py-3 rounded-2xl shadow-lg text-sm font-medium fade max-w-xs`;d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200)}
function modal(html){$('#modalbox').innerHTML=html;$('#modal').classList.replace('hidden','flex')}
function closeModal(){$('#modal').classList.replace('flex','hidden')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function confirmBox(msg){return new Promise(res=>{modal(`<h3 class="d font-bold text-lg mb-2">⚠️ Confirmar exclusão</h3><p class="text-sm text-slate-600 mb-5">${esc(msg)}</p><div class="flex justify-end gap-2"><button id="cn" class="px-4 py-2 text-sm rounded-xl hover:bg-slate-100">Cancelar</button><button id="ok" class="px-4 py-2 text-sm rounded-xl bg-red-600 text-white font-semibold">Excluir</button></div>`);$('#cn').onclick=()=>{closeModal();res(false)};$('#ok').onclick=()=>{closeModal();res(true)}})}

function days(d){const t=new Date();t.setHours(0,0,0,0);const n=Math.ceil((new Date(d+'T00:00:00')-t)/864e5);
 if(n<0)return['Realizada','bg-slate-100 text-slate-500'];if(n===0)return['É hoje!','bg-red-100 text-red-700'];if(n===1)return['Amanhã','bg-amber-100 text-amber-800'];return[`Faltam ${n} dias`,'bg-blue-100 text-blue-700']}
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
const lessonSteps=l=>[S.progress.sum.includes(l.id),S.progress.vid.includes(l.id),!!S.progress.quiz[l.id]];

function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button onclick="go('${k}')" class="shrink-0 px-3.5 py-2 rounded-xl font-medium ${tab===k?'bg-blue-600 text-white font-semibold shadow':'text-slate-600 hover:bg-blue-50'}">${l}</button>`).join('');
 $('#av').textContent=S.profile.avatar;$('#nm').textContent=S.profile.name.split(' ')[0];$('#rl').textContent=S.profile.role==='owner'?'Proprietário':'Aluno'}
function go(t){tab=t;render()}
function render(){nav();({dash:rDash,trail:rTrail,exams:rExams,lib:rLib,tutor:rTutor,owner:rOwner})[tab]();scrollTo({top:0})}

/* ---------- INÍCIO ---------- */
function rDash(){
 const L=S.data.lessons,tot=L.length*3,done=L.reduce((a,l)=>a+lessonSteps(l).filter(Boolean).length,0),pct=tot?Math.round(done/tot*100):0;
 const full=L.filter(l=>lessonSteps(l).every(Boolean)).length;
 const sc=Object.values(S.progress.quiz),avg=sc.length?Math.round(sc.reduce((a,s)=>a+s.score/s.total*100,0)/sc.length)+'%':'--';
 const pr={info:['Informativo','bg-blue-100 text-blue-700','border-l-blue-600'],important:['Importante','bg-amber-100 text-amber-800','border-l-amber-500'],urgent:['Urgente','bg-red-100 text-red-700','border-l-red-500']};
 const anns=[...S.data.announcements].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
 const exams=[...S.data.exams].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
 $('#main').innerHTML=`<div class="fade space-y-6">
 <div class="rounded-3xl bg-gradient-to-r from-blue-700 via-blue-600 to-sky-500 p-6 sm:p-8 text-white shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-6">
  <div class="max-w-xl"><div class="inline-block px-3 py-1 rounded-full bg-white/15 text-xs font-semibold mb-3">● Progresso salvo neste navegador</div>
   <h1 class="d text-2xl sm:text-3xl font-extrabold">Olá, ${esc(S.profile.name.split(' ')[0])}! 👋</h1>
   <p class="text-blue-100 text-sm sm:text-base mt-2">Seu espaço para estudar com leveza: trilhas, provas, materiais e um Tutor IA.</p>
   <div class="flex flex-wrap gap-3 mt-5"><button onclick="go('trail')" class="px-5 py-2.5 rounded-xl bg-white text-blue-700 font-bold text-sm">▶ Continuar Trilha</button><button onclick="go('tutor')" class="px-5 py-2.5 rounded-xl bg-blue-800/40 border border-white/20 font-semibold text-sm">✨ Perguntar ao Tutor</button></div></div>
  <div class="bg-white/15 border border-white/20 rounded-2xl p-5 flex items-center gap-4 shrink-0">
   <div class="relative w-20 h-20 flex items-center justify-center"><svg class="w-20 h-20 -rotate-90"><circle cx="40" cy="40" r="34" stroke="rgba(255,255,255,.2)" stroke-width="7" fill="none"/><circle cx="40" cy="40" r="34" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="${213.6-pct/100*213.6}"/></svg><span class="absolute d font-extrabold text-lg">${pct}%</span></div>
   <div><p class="text-xs uppercase tracking-wider text-blue-100 font-semibold">Concluído</p><p class="d font-bold text-lg">${full} de ${L.length} módulos</p></div></div></div>
 <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${[['✅','Módulos concluídos',full+'/'+L.length],['🏆','Média nos quizzes',avg],['📅','Próximas provas',S.data.exams.length],['📁','Materiais',S.data.materials.length]].map(([i,l,v])=>`<div class="card flex items-center gap-3"><div class="text-2xl">${i}</div><div><p class="text-xs text-slate-500">${l}</p><p class="d font-extrabold text-xl">${v}</p></div></div>`).join('')}</div>
 <div class="grid lg:grid-cols-3 gap-6">
  <div class="card lg:col-span-2"><h2 class="d font-bold text-lg mb-4">📢 Mural de Avisos</h2><div class="space-y-3">${anns.map(a=>{const p=pr[a.priority]||pr.info;return`<div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 border-l-4 ${p[2]}"><div class="flex justify-between mb-1.5"><span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${p[1]}">${p[0]}</span><span class="text-xs text-slate-400">${new Date(a.createdAt).toLocaleDateString('pt-BR')}</span></div><h4 class="font-bold text-sm">${esc(a.title)}</h4><p class="text-sm text-slate-600 mt-1">${esc(a.content)}</p></div>`}).join('')||'<p class="text-sm text-slate-400 text-center py-4">Nenhum aviso.</p>'}</div></div>
  <div class="space-y-6">
   <div class="card"><div class="flex justify-between mb-3"><h3 class="d font-bold">⏰ Próximas Avaliações</h3><button onclick="go('exams')" class="text-xs font-semibold text-blue-600">Ver todas</button></div><div class="space-y-2.5">${exams.map(e=>{const c=days(e.date);return`<div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 flex justify-between gap-2 items-center"><div class="min-w-0"><p class="text-xs font-bold text-blue-700">${esc(e.subject)} • ${fmtDate(e.date)}</p><p class="text-xs font-semibold truncate">${esc(e.title)}</p></div><span class="text-[11px] font-bold px-2.5 py-1 rounded-full shrink-0 ${c[1]}">${c[0]}</span></div>`}).join('')||'<p class="text-xs text-slate-400">Sem provas.</p>'}</div></div>
   <div class="card bg-blue-50/60"><h3 class="d font-bold mb-3">📝 Minhas Anotações</h3><textarea id="notes" rows="5" class="inp resize-none" placeholder="Fórmulas, metas, lembretes...">${esc(S.progress.notes)}</textarea><div class="flex justify-end mt-2"><button class="btn" onclick="S.progress.notes=$('#notes').value;save();toast('Anotações salvas!','success')">Salvar</button></div></div>
  </div></div></div>`}

/* ---------- TRILHA ---------- */
function rTrail(){
 const subs=[...new Set(S.data.lessons.map(l=>l.subject))];
 const L=[...S.data.lessons].sort((a,b)=>(a.order||99)-(b.order||99)).filter(l=>trailFilter==='all'||l.subject===trailFilter);
 if(!L.some(l=>l.id===activeLesson))activeLesson=L[0]?.id||null;
 $('#main').innerHTML=`<div class="fade space-y-6"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h1 class="d text-2xl sm:text-3xl font-extrabold">Trilha Interativa de Estudos</h1><p class="text-sm text-slate-500">Resumos, videoaulas e quizzes por módulo.</p></div>
 <select class="inp sm:w-56" onchange="trailFilter=this.value;rTrail()"><option value="all">Todas as disciplinas</option>${subs.map(s=>`<option ${s===trailFilter?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
 <div class="grid lg:grid-cols-12 gap-6 items-start"><div class="lg:col-span-5 space-y-3">${L.map((l,i)=>{const st=lessonSteps(l),n=st.filter(Boolean).length,sel=l.id===activeLesson;return`<div onclick="activeLesson='${l.id}';rTrail()" class="cursor-pointer p-4 rounded-3xl border-2 bg-white transition ${sel?'border-blue-600 shadow-md':'border-slate-200 hover:border-blue-300'}"><div class="flex gap-3"><div class="w-10 h-10 rounded-2xl flex items-center justify-center font-extrabold text-sm shrink-0 ${n===3?'bg-emerald-500 text-white':sel?'bg-blue-600 text-white':'bg-blue-50 text-blue-700'}">${n===3?'✓':l.order||i+1}</div><div class="min-w-0 flex-1"><div class="flex justify-between"><span class="text-[11px] font-bold uppercase text-sky-600">${esc(l.subject)}</span><span class="text-[11px] font-semibold text-slate-400">${n}/3</span></div><h3 class="d font-bold">${esc(l.title)}</h3><p class="text-xs text-slate-500 mt-1">${esc(l.description)}</p><div class="flex gap-1.5 mt-2">${['Resumo','Vídeo','Quiz'].map((x,k)=>`<span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ${st[k]?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-500'}">${x}</span>`).join('')}</div></div></div></div>`}).join('')||'<div class="card text-center text-sm text-slate-400">Nenhuma etapa.</div>'}</div>
 <div id="ws" class="lg:col-span-7 bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden"></div></div></div>`;
 workspace()}
function workspace(){
 const l=S.data.lessons.find(x=>x.id===activeLesson),ws=$('#ws');if(!l||!ws)return;
 const [sd,vd,qd]=lessonSteps(l),qr=S.progress.quiz[l.id];
 const tabs=[['summary','📄 Resumo'],['video','▶️ Videoaula'],['quiz','❓ Quiz']];
 let body='';
 if(sub==='summary')body=`<div class="sum bg-slate-50 p-5 rounded-2xl border border-slate-100 text-sm sm:text-base leading-relaxed">${l.summary}</div><div class="flex flex-wrap justify-between gap-3 mt-4"><button class="btn2" onclick="askTutor('Estou estudando o módulo «${esc(l.title)}» de ${esc(l.subject)}. Explique os pontos mais importantes de forma simples e dê 1 exemplo prático.')">✨ Explicação extra do Tutor IA</button><button class="btn ${sd?'!bg-emerald-600':''}" onclick="toggle('sum')">${sd?'✓ Resumo concluído':'Marcar resumo como lido'}</button></div>`;
 if(sub==='video')body=`<div class="aspect-video rounded-2xl overflow-hidden bg-slate-900 border border-slate-200"><iframe class="w-full h-full" src="${esc(l.video)}" title="Videoaula" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="flex flex-wrap justify-between items-center gap-3 mt-4"><a href="${esc(l.video.replace('/embed/','/watch?v='))}" target="_blank" rel="noopener" class="text-xs text-blue-600 underline">Abrir no YouTube</a><button class="btn ${vd?'!bg-emerald-600':''}" onclick="toggle('vid')">${vd?'✓ Aula assistida':'Marcar aula como assistida'}</button></div>`;
 if(sub==='quiz')body=(qr?`<div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 flex justify-between items-center mb-4"><p class="text-sm font-bold text-emerald-900">Você acertou ${qr.score} de ${qr.total} (${Math.round(qr.score/qr.total*100)}%)</p><button class="text-xs font-semibold underline text-emerald-800" onclick="delete S.progress.quiz['${l.id}'];save();rTrail()">Refazer</button></div>`:'')+
  `<div class="space-y-5">${l.questions.map((q,qi)=>{const ch=qr?.answers?.[qi];return`<div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2"><p class="font-bold text-sm"><span class="text-blue-600">${qi+1}.</span> ${esc(q.q)}</p>${q.o.map((o,oi)=>{let s='bg-white border-slate-200 hover:border-blue-400';if(ch!==undefined)s=oi===q.c?'bg-emerald-50 border-emerald-500 font-semibold':oi===ch?'bg-red-50 border-red-400':'bg-white/60 border-slate-200 text-slate-400';return`<button onclick="answer(${qi},${oi})" class="w-full text-left p-3 rounded-xl border text-sm flex gap-3 ${s}"><span class="w-6 h-6 rounded-lg bg-slate-100 flex items-center justify-center font-bold text-xs shrink-0">${'ABCD'[oi]}</span><span>${esc(o)}</span></button>`}).join('')}${ch!==undefined?`<div class="p-3 rounded-xl bg-blue-50 border border-blue-100 text-xs"><strong>Explicação:</strong> ${esc(q.e)}</div>`:''}</div>`}).join('')||'<p class="text-sm text-slate-400">Sem questões.</p>'}</div>`;
 ws.innerHTML=`<div class="bg-gradient-to-r from-blue-600 to-sky-500 p-6 text-white"><div class="flex justify-between mb-2"><span class="px-3 py-1 rounded-full bg-white/20 text-xs font-bold uppercase">${esc(l.subject)}</span><span class="px-3 py-1 rounded-full bg-white/20 text-xs font-semibold">${sd&&vd&&qd?'Concluído ✓':'Em estudo'}</span></div><h2 class="d text-xl font-extrabold">${esc(l.title)}</h2><p class="text-blue-100 text-sm mt-1">${esc(l.description)}</p></div>
 <div class="flex gap-2 px-4 pt-3 bg-slate-50 border-b border-slate-200">${tabs.map(([k,t])=>`<button onclick="sub='${k}';workspace()" class="px-4 py-2.5 rounded-t-xl text-sm ${sub===k?'bg-white font-bold text-blue-700 border-t border-x border-slate-200 -mb-px':'text-slate-600'}">${t}</button>`).join('')}</div><div class="p-5">${body}</div>`}
function toggle(t){const a=S.progress[t],i=a.indexOf(activeLesson);i>-1?a.splice(i,1):(a.push(activeLesson),toast('Progresso salvo!','success'));save();rTrail()}
function answer(qi,oi){const l=S.data.lessons.find(x=>x.id===activeLesson);const r=S.progress.quiz[l.id]||{score:0,total:l.questions.length,answers:{}};r.answers[qi]=oi;r.score=l.questions.filter((q,i)=>r.answers[i]===q.c).length;r.total=l.questions.length;S.progress.quiz[l.id]=r;save();rTrail();toast(l.questions[qi].c===oi?'Resposta correta!':'Veja a explicação do gabarito.',l.questions[qi].c===oi?'success':'info')}

/* ---------- PROVAS ---------- */
function rExams(){
 const E=[...S.data.exams].sort((a,b)=>a.date.localeCompare(b.date));
 $('#main').innerHTML=`<div class="fade space-y-6"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h1 class="d text-2xl sm:text-3xl font-extrabold">Horários de Provas</h1><p class="text-sm text-slate-500">Contagem regressiva automática, salas e links.</p></div><button class="btn self-start" onclick="ownerGate('exams')">+ Adicionar prova (Proprietário)</button></div>
 <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">${E.map(e=>{const c=days(e.date);return`<div class="card hover:shadow-md flex flex-col justify-between"><div><div class="flex justify-between mb-3"><span class="px-3 py-1 rounded-full bg-sky-50 text-sky-600 text-xs font-bold">${esc(e.subject)}</span><span class="px-3 py-1 rounded-full text-xs font-bold ${c[1]}">${c[0]}</span></div><h3 class="d font-bold text-lg">${esc(e.title)}</h3><p class="mt-3 text-sm text-slate-600">📅 ${fmtDate(e.date)} às <strong>${esc(e.time)}</strong></p><p class="text-sm text-slate-600">📍 ${esc(e.location)}</p></div><button class="btn2 mt-4 w-full" onclick="askTutor('Tenho a prova «${esc(e.title)}» de ${esc(e.subject)} em breve. Crie um guia rápido de revisão com os 3 tópicos essenciais.')">✨ Preparar revisão com IA</button></div>`}).join('')||'<div class="card col-span-full text-center text-slate-400">Nenhuma avaliação agendada.</div>'}</div></div>`}

/* ---------- BIBLIOTECA ---------- */
function rLib(){
 const subs=[...new Set(S.data.materials.map(m=>m.subject))];
 $('#main').innerHTML=`<div class="fade space-y-6"><div class="flex flex-col md:flex-row md:items-center justify-between gap-3"><div><h1 class="d text-2xl sm:text-3xl font-extrabold">Biblioteca de Materiais</h1><p class="text-sm text-slate-500">Apostilas, mapas mentais, slides e listas.</p></div><div class="flex gap-2"><input id="ls" class="inp" placeholder="🔍 Buscar..." value="${esc(libSearch)}"><select id="lf" class="inp"><option value="all">Todas</option>${subs.map(s=>`<option ${s===libFilter?'selected':''}>${esc(s)}</option>`).join('')}</select></div></div><div id="lg" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div></div>`;
 const draw=()=>{libSearch=$('#ls').value;libFilter=$('#lf').value;const q=libSearch.toLowerCase();const M=S.data.materials.filter(m=>(libFilter==='all'||m.subject===libFilter)&&(m.title+m.description).toLowerCase().includes(q));
  const ic={'PDF':'📄','Mapa Mental':'🕸️','Lista de Exercícios':'✅','Slides':'📊'};
  $('#lg').innerHTML=M.map(m=>`<div class="card hover:shadow-md flex flex-col justify-between"><div><div class="flex justify-between mb-3"><div class="w-11 h-11 rounded-2xl bg-blue-50 flex items-center justify-center text-xl">${ic[m.type]||'📁'}</div><span class="text-[11px] font-bold uppercase px-3 py-1 rounded-full bg-slate-100 text-slate-600 self-start">${esc(m.type)}</span></div><span class="text-xs font-bold text-sky-600">${esc(m.subject)}</span><h3 class="d font-bold text-lg">${esc(m.title)}</h3><p class="text-sm text-slate-500 mt-2">${esc(m.description)}</p></div><button class="btn mt-4 w-full" onclick="openMat('${m.id}')">👁 Visualizar & Baixar</button></div>`).join('')||'<div class="card col-span-full text-center text-slate-400">Nenhum material encontrado.</div>'};
 $('#ls').oninput=draw;$('#lf').onchange=draw;draw()}
function openMat(id){const m=S.data.materials.find(x=>x.id===id);if(!m)return;const ok=/^https?:\/\//.test(m.url||'');
 modal(`<span class="text-[11px] font-bold uppercase px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-700">${esc(m.subject)} • ${esc(m.type)}</span><h3 class="d font-bold text-lg mt-2">${esc(m.title)}</h3><p class="text-sm text-slate-600 bg-slate-50 p-4 rounded-2xl border border-slate-100 my-4">${esc(m.description)}</p><div class="flex justify-end gap-2"><button class="px-4 py-2 text-sm rounded-xl hover:bg-slate-100" onclick="closeModal()">Fechar</button>${ok?`<a class="btn" target="_blank" rel="noopener" href="${esc(m.url)}">Acessar arquivo</a>`:`<button class="btn" onclick="closeModal();toast('Este material ainda não tem arquivo anexado.','info')">Baixar</button>`}</div>`)}

/* ---------- TUTOR IA ---------- */
function rTutor(){
 $('#main').innerHTML=`<div class="fade space-y-4"><div class="flex justify-between items-start gap-3"><div><h1 class="d text-2xl sm:text-3xl font-extrabold">Tutor Leve IA ✨</h1><p class="text-sm text-slate-500">Resumos, exercícios passo a passo e questões de treino.</p></div><button class="btn2" onclick="chat=[];rTutor()">↺ Limpar</button></div>
 <div class="bg-white rounded-3xl border border-slate-200 shadow-sm flex flex-col overflow-hidden" style="height:min(620px,70vh)">
  <div class="p-3 bg-blue-50/70 border-b border-blue-100 flex gap-2 overflow-x-auto text-xs">${[['📐 Função quadrática','Crie um resumo esquematizado em tópicos sobre Funções do 2º Grau com dicas de prova.'],['🌿 Quiz de Biologia','Gere 3 questões de múltipla escolha sobre Ecologia com gabarito comentado.'],['🗓️ Cronograma','Monte um cronograma leve de revisão de 2 horas por dia para a semana de provas.']].map(([l,p])=>`<button class="shrink-0 px-3 py-1.5 rounded-full bg-white border border-blue-200 font-medium text-blue-700" onclick="sendChat(${esc(JSON.stringify(JSON.stringify(p)))})">${l}</button>`).join('')}</div>
  <div id="cm" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/40"><div class="max-w-xl bg-white border border-slate-200 rounded-2xl rounded-tl-none p-4 text-sm"><p class="font-bold text-blue-900 mb-1">Olá! Eu sou o Tutor Leve IA ✨</p>Qual matéria ou dúvida você quer explorar agora?</div>${chat.map(bubble).join('')}</div>
  <form id="cf" class="p-3 border-t border-slate-200 flex gap-2"><input id="ci" required class="inp !rounded-2xl" placeholder="Digite sua dúvida ou peça um resumo..."><button id="cb" class="btn !rounded-2xl shrink-0">Enviar</button></form></div></div>`;
 $('#cf').onsubmit=e=>{e.preventDefault();const v=$('#ci').value.trim();if(v)sendChat(JSON.stringify(v))};
 const cm=$('#cm');cm.scrollTop=cm.scrollHeight}
function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|\n)#{1,4} (.+)/g,'$1<strong>$2</strong>').replace(/\n[-*] /g,'<br>• ').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}
function bubble(m){return m.role==='user'?`<div class="flex justify-end"><div class="bg-blue-600 text-white rounded-2xl rounded-tr-none p-3.5 text-sm max-w-xl">${esc(m.content)}</div></div>`:`<div class="max-w-2xl bg-white border border-slate-200 rounded-2xl rounded-tl-none p-4 text-sm leading-relaxed">${m.html||md(m.content)}</div>`}
function askTutor(p){tab='tutor';render();sendChat(JSON.stringify(p))}
async function sendChat(pj){
 const text=JSON.parse(pj);if(tab!=='tutor'){tab='tutor';render()}
 chat.push({role:'user',content:text});rTutor();
 const cm=$('#cm');const hold=document.createElement('div');hold.className='max-w-xs bg-white border border-slate-200 rounded-2xl p-3 text-sm text-blue-600 font-medium';hold.textContent='Pensando na melhor explicação...';cm.appendChild(hold);cm.scrollTop=cm.scrollHeight;
 $('#ci').disabled=true;$('#cb').disabled=true;
 let reply;
 try{
  const sample=await claude.use('sample');if(!sample)throw {code:'unavailable'};
  const sys='Você é o Tutor Leve IA, assistente educacional da plataforma brasileira "Estudo Leve". Tom acolhedor, didático, claro e motivador. Responda sempre em português do Brasil, com tópicos, **negrito** e exemplos práticos, sem sobrecarregar o estudante.';
  const msgs=chat.slice(-10).map(m=>({role:m.role,content:m.content}));
  msgs[0]={...msgs[0],content:sys+'\n\n'+msgs[0].content};
  const r=await sample(msgs,{cache:false,onText:({text})=>{hold.className='max-w-2xl bg-white border border-slate-200 rounded-2xl rounded-tl-none p-4 text-sm leading-relaxed';hold.innerHTML=md(text);cm.scrollTop=cm.scrollHeight}});
  reply=r.text;
 }catch(err){reply=err?.code==='not_granted'?'Para usar o Tutor IA, permita o acesso quando o navegador pedir e tente de novo.':'Não consegui responder agora. Revise o resumo na Trilha de Estudos e tente novamente em instantes!'}
 chat.push({role:'assistant',content:reply});rTutor()}

/* ---------- PROPRIETÁRIO ---------- */
function ownerGate(sec){ownerSec=sec||ownerSec;tab='owner';render();if(S.profile.role!=='owner')openProfile('owner')}
function rOwner(){
 if(S.profile.role!=='owner'){$('#main').innerHTML=`<div class="card text-center max-w-xl mx-auto p-10 fade"><div class="text-4xl mb-3">🔒</div><h2 class="d text-2xl font-extrabold">Área restrita ao Proprietário</h2><p class="text-sm text-slate-500 mt-2">Publique avisos, cadastre provas, crie módulos e adicione materiais.</p><button class="btn mt-5" onclick="openProfile('owner')">🔑 Desbloquear modo Proprietário</button></div>`;return}
 const secs=[['ann','📢 Avisos'],['exams','📅 Provas'],['lessons','🗺️ Módulos'],['mats','📚 Materiais']];
 const list=(col,fn)=>S.data[col].map(i=>`<div class="p-3 rounded-2xl border border-slate-200 flex justify-between items-center gap-3"><div class="min-w-0 text-sm">${fn(i)}</div><button onclick="del('${col}','${i.id}')" class="p-2 text-red-500 hover:bg-red-50 rounded-xl shrink-0">🗑</button></div>`).join('')||'<p class="text-sm text-slate-400">Vazio.</p>';
 const F={
  ann:[`<form id="fa" class="space-y-3"><h3 class="d font-bold text-lg">Publicar aviso</h3><input class="inp" name="title" required placeholder="Título"><select class="inp" name="priority"><option value="info">Informativo</option><option value="important">Importante</option><option value="urgent">Urgente</option></select><textarea class="inp" name="content" rows="4" required placeholder="Mensagem para a turma"></textarea><button class="btn w-full">Publicar</button></form>`,list('announcements',a=>`<p class="font-bold">${esc(a.title)}</p><p class="text-xs text-slate-500">${esc(a.content).slice(0,90)}</p>`)],
  exams:[`<form id="fe" class="space-y-3"><h3 class="d font-bold text-lg">Agendar avaliação</h3><input class="inp" name="subject" required placeholder="Disciplina"><input class="inp" name="title" required placeholder="Título / conteúdo"><div class="grid grid-cols-2 gap-2"><input class="inp" type="date" name="date" required><input class="inp" type="time" name="time" required></div><input class="inp" name="location" required placeholder="Sala ou link"><button class="btn w-full">Salvar prova</button></form>`,list('exams',e=>`<p class="font-bold">${esc(e.subject)}: ${esc(e.title)}</p><p class="text-xs text-slate-500">${esc(e.date)} às ${esc(e.time)} • ${esc(e.location)}</p>`)],
  lessons:[`<form id="fl" class="space-y-2.5"><h3 class="d font-bold text-lg">Novo módulo</h3><div class="grid grid-cols-2 gap-2"><input class="inp" name="subject" required placeholder="Disciplina"><input class="inp" type="number" name="order" min="1" value="${S.data.lessons.length+1}"></div><input class="inp" name="title" required placeholder="Título do módulo"><textarea class="inp" name="summary" rows="3" required placeholder="Resumo (um parágrafo por linha)"></textarea><input class="inp" type="url" name="video" placeholder="URL de embed do YouTube (opcional)"><div class="p-3 rounded-2xl bg-blue-50 space-y-2"><p class="text-xs font-bold text-blue-900">Questão do quiz</p><input class="inp" name="q" required placeholder="Enunciado">${[0,1,2,3].map(i=>`<input class="inp" name="o${i}" required placeholder="Alternativa ${'ABCD'[i]}">`).join('')}<select class="inp" name="c">${[0,1,2,3].map(i=>`<option value="${i}">Correta: ${'ABCD'[i]}</option>`).join('')}</select><input class="inp" name="e" required placeholder="Explicação do gabarito"></div><button class="btn w-full">Publicar módulo</button></form>`,list('lessons',l=>`<p class="text-[10px] font-bold uppercase text-blue-600">${esc(l.subject)} • ordem ${l.order||1}</p><p class="font-bold">${esc(l.title)}</p>`)],
  mats:[`<form id="fm" class="space-y-3"><h3 class="d font-bold text-lg">Novo material</h3><input class="inp" name="title" required placeholder="Título"><div class="grid grid-cols-2 gap-2"><input class="inp" name="subject" required placeholder="Disciplina"><select class="inp" name="type"><option>PDF</option><option>Mapa Mental</option><option>Lista de Exercícios</option><option>Slides</option></select></div><textarea class="inp" name="description" rows="2" required placeholder="Descrição"></textarea><input class="inp" type="url" name="url" placeholder="Link externo (opcional)"><button class="btn w-full">Adicionar</button></form>`,list('materials',m=>`<p class="text-[10px] font-bold uppercase text-sky-600">${esc(m.subject)} • ${esc(m.type)}</p><p class="font-bold">${esc(m.title)}</p>`)]};
 const [form,items]=F[ownerSec];
 $('#main').innerHTML=`<div class="fade space-y-5"><div class="rounded-3xl p-6 text-white bg-gradient-to-r from-slate-900 to-blue-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><span class="px-3 py-1 rounded-full bg-amber-400/20 text-amber-300 text-xs font-bold uppercase">Modo administrador</span><h1 class="d text-2xl font-extrabold mt-2">Painel do Proprietário</h1><p class="text-blue-200 text-sm">As alterações ficam salvas neste navegador.</p></div><button class="px-4 py-2 rounded-xl bg-white/10 text-xs font-semibold border border-white/15 self-start" onclick="S.profile.role='student';save();go('dash')">Voltar à visão de aluno</button></div>
 <div class="flex flex-wrap gap-2">${secs.map(([k,l])=>`<button onclick="ownerSec='${k}';rOwner()" class="px-4 py-2.5 rounded-xl text-sm font-semibold ${ownerSec===k?'bg-blue-600 text-white':'bg-white border border-slate-200 text-slate-700'}">${l}</button>`).join('')}</div>
 <div class="grid lg:grid-cols-12 gap-6"><div class="card lg:col-span-5">${form}</div><div class="card lg:col-span-7"><h3 class="d font-bold text-lg mb-3">Itens cadastrados</h3><div class="space-y-2.5">${items}</div></div></div></div>`;
 const fd=f=>Object.fromEntries(new FormData(f).entries());const uid=()=>'x'+Date.now();
 const hook=(id,fn,msg)=>{const f=$('#'+id);if(f)f.onsubmit=e=>{e.preventDefault();fn(fd(f));save();toast(msg,'success');rOwner()}};
 hook('fa',d=>S.data.announcements.unshift({id:uid(),...d,createdAt:new Date().toISOString()}),'Aviso publicado!');
 hook('fe',d=>S.data.exams.push({id:uid(),...d}),'Prova adicionada!');
 hook('fl',d=>S.data.lessons.push({id:uid(),order:+d.order||1,subject:d.subject,title:d.title,description:`Módulo de ${d.subject} criado pelo Proprietário.`,summary:d.summary.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(''),video:/^https:\/\/www\.youtube(-nocookie)?\.com\/embed\//.test(d.video)?d.video:'https://www.youtube.com/embed/Z5a324-O0aM',questions:[{q:d.q,o:[d.o0,d.o1,d.o2,d.o3],c:+d.c,e:d.e}]}),'Módulo publicado!');
 hook('fm',d=>S.data.materials.push({id:uid(),...d}),'Material adicionado!')}
async function del(col,id){if(!await confirmBox('Isto remove o item para todos os alunos deste navegador.'))return;S.data[col]=S.data[col].filter(i=>i.id!==id);save();rOwner();toast('Item removido.','info')}

/* ---------- PERFIL ---------- */
let pRole='student',pAv='🎓';
function openProfile(force){pRole=force||S.profile.role;pAv=S.profile.avatar;drawProfile()}
function drawProfile(){
 modal(`<div class="flex justify-between mb-4"><div><h2 class="d font-bold text-xl">Perfil Estudo Leve</h2><p class="text-xs text-slate-500">Salvo neste navegador</p></div><button onclick="closeModal()" class="text-slate-400 text-xl">✕</button></div>
 <form id="pf" class="space-y-4"><div><label class="text-xs font-semibold uppercase text-slate-500">Nome</label><input id="pn" class="inp mt-1" required value="${esc(S.profile.name)}" placeholder="Ex: Ana Clara Silva"></div>
 <div><label class="text-xs font-semibold uppercase text-slate-500">Avatar</label><div class="grid grid-cols-5 gap-2 mt-1">${AVATARS.map(a=>`<button type="button" onclick="pAv='${a}';keepName()" class="text-2xl p-2 rounded-xl border ${a===pAv?'border-blue-600 bg-blue-50 ring-2 ring-blue-200':'border-slate-200'}">${a}</button>`).join('')}</div></div>
 <div class="grid grid-cols-2 gap-2"><button type="button" onclick="pRole='student';keepName()" class="p-3 rounded-xl border-2 text-left text-sm font-semibold ${pRole==='student'?'border-blue-600 bg-blue-50 text-blue-800':'border-slate-200'}">🎓 Estudante</button><button type="button" onclick="pRole='owner';keepName()" class="p-3 rounded-xl border-2 text-left text-sm font-semibold ${pRole==='owner'?'border-blue-600 bg-blue-50 text-blue-800':'border-slate-200'}">🛡️ Proprietário</button></div>
 ${pRole==='owner'&&S.profile.role!=='owner'?`<div class="bg-amber-50 border border-amber-200 rounded-xl p-3"><label class="text-xs font-semibold text-amber-800">Chave do Proprietário</label><input id="pp" type="password" class="inp mt-1" placeholder="Senha de demonstração: 1234"></div>`:''}
 <button class="btn w-full">Salvar perfil</button></form>`);
 $('#pf').onsubmit=e=>{e.preventDefault();const name=$('#pn').value.trim();if(!name)return;
  if(pRole==='owner'&&S.profile.role!=='owner'&&$('#pp')?.value.trim()!=='1234'){toast('Chave incorreta. Use 1234.','error');return}
  S.profile={name,avatar:pAv,role:pRole};save();closeModal();toast(`Perfil atualizado! Bem-vindo(a), ${name}.`,'success');if(pRole==='owner')tab='owner';render()}}
function keepName(){const v=$('#pn')?.value;if(v)S.profile.name=v;drawProfile()}

render();
</script>
